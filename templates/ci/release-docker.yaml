name: Release Docker

on:
  push:
    tags:
      - "v*"

env:
  DOCKER_IMAGE: "mcp-template-image-placeholder"
  DOCKER_REGISTRY: "__MCP_DOCKER_REGISTRY__"
  GO_VERSION: "__MCP_GO_VERSION__"

jobs:
  resolve-platforms:
    name: Resolve Docker platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: platforms
        run: echo "platforms=$(jq -cr '.docker | join(",")' .github/ci/release-platforms.json)" >> "$GITHUB_OUTPUT"

  validate-tag:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Validate stable semantic version tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable semantic version tag in the form vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  validate-release:
    name: Validate release build
    needs: validate-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Vet and format
        run: |
          go vet ./...
          test -z "$(gofmt -l cmd internal pkg)"
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Run race tests
        run: go test -race ./...
      - name: Verify module
        run: go mod verify
      - name: Build
        run: make build
      - name: Smoke CLI
        run: ./bin/${BINARY_NAME} version

  release:
    name: Publish Docker image
    needs: [resolve-platforms, validate-tag, validate-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # __MCP_DOCKER_PACKAGES_PERMISSION__
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to Docker registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: __MCP_DOCKER_USERNAME__
          password: __MCP_DOCKER_PASSWORD__
      - id: metadata
        name: Set build metadata
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ needs.resolve-platforms.outputs.platforms }}
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ needs.validate-tag.outputs.tag }}
            ${{ env.DOCKER_IMAGE }}:latest
          build-args: |
            VERSION=${{ needs.validate-tag.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}
